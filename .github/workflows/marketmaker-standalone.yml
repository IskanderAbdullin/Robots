name: MarketMaker standalone checks
on:
  push:
    branches: [main]
    paths:
      - 'MarketMakerSPBStandalone/**'
      - '.github/workflows/marketmaker-standalone.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile
        run: dotnet build MarketMakerSPBStandalone/MarketMakerSPBStandalone.csproj -c Release --nologo -warnaserror
      - name: Compile T-Invest read-only adapter
        run: dotnet build MarketMakerSPBStandalone/TInvest/TInvestAdapter.csproj -c Release --nologo -warnaserror
      - name: Compile console application
        run: dotnet build MarketMakerSPBStandalone/App/App.csproj -c Release --nologo -warnaserror
      - name: Run paper-only demo
        run: dotnet run --project MarketMakerSPBStandalone/App/App.csproj -c Release -- --demo
      - name: Offline deterministic stand
        run: dotnet run --project MarketMakerSPBStandalone/tests/Stand/Stand.csproj -c Release
